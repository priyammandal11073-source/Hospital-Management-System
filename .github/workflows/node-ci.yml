name: Hospital Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  client:
    name: Build React client
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

  server:
    name: Check Express server
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # The project has no automated server tests yet. This confirms the
      # JavaScript files parse successfully until tests are added.
      # Skip node_modules: dependencies such as fontkit ship .js with
      # decorators (@cache) that node --check cannot parse.
      - name: Check server syntax
        working-directory: server
        run: find . -name node_modules -prune -o -type f -name "*.js" -print0 | xargs -0 -n1 node --check
