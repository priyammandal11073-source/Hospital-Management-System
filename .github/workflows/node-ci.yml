name: Hospital Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  client:
    name: Build React client
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Test client
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

  server:
    name: Check Express server
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Test server
        working-directory: server
        run: npm test

      # Confirms every JavaScript file parses successfully. Skip node_modules:
      # dependencies such as fontkit ship .js with decorators (@cache) that
      # node --check cannot parse.
      - name: Check server syntax
        working-directory: server
        run: find . -type f -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node --check
